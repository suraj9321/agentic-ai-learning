[project]
name = "agentic-ai-learning-basics-to-langgraph-prod"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "chromadb>=1.5.9",
    "fastembed>=0.9.1",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.16.0",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
]

# Makes the shared helpers in course_utils/ importable from every lesson folder
# (`from course_utils import trace`). `uv sync` installs this project into .venv in
# "editable" mode, so changes to course_utils/ take effect immediately.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["course_utils"]
